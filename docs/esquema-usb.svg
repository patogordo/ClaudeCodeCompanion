<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 660" width="1010" height="660"><style>text{font-family:Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2328}.h{font-size:19px;font-weight:700}.t{font-size:15px;font-weight:600}.s{font-size:12px;fill:#57606a}.pin{font-weight:700}
.box{fill:#f6f8fa;stroke:#1f2328;stroke-width:1.5}.usb{fill:#1f2328}.res{fill:#fff;stroke:#1f2328;stroke-width:1.5}.note{fill:#fff8c5;stroke:#d4a72c}
path{fill:none;stroke-width:2.5}.v5{stroke:#cf222e}.v33{stroke:#8250df}.gnd{stroke:#57606a}.sig{stroke:#0969da}.dat{stroke:#d97757}.cap{stroke:#1f2328;stroke-width:3}</style><rect width="1010" height="660" fill="#fff"/><text x="30" y="36" class="h" text-anchor="start">Companion: ligações (só USB-C)</text><text x="30" y="58" class="s" text-anchor="start">Os números são os da ESP32-C3 SuperMini; entre parênteses, o nome no XIAO.</text><rect x="330" y="110" width="200" height="420" rx="8" class="box"/><rect x="405" y="96" width="50" height="18" rx="8" class="usb"/><text x="430" y="134" class="s" text-anchor="middle">USB-C: energia</text><text x="430" y="285" class="t" text-anchor="middle">ESP32-C3</text><text x="342" y="185" class="pin" text-anchor="start">5V</text><text x="342" y="265" class="pin" text-anchor="start">3V3</text><text x="342" y="335" class="pin" text-anchor="start">2 (D0/A0)</text><text x="342" y="405" class="pin" text-anchor="start">3 (D1)</text><text x="342" y="485" class="pin" text-anchor="start">4 (D2)</text><text x="518" y="185" class="pin" text-anchor="end">5 (D3)</text><text x="518" y="505" class="pin" text-anchor="end">GND</text><path class="v5" d="M330 180H290V84H940V150"/><path class="v5" d="M610 84V130"/><circle cx="610" cy="84" r="4.5" fill="#cf222e"/><path class="v5" d="M770 84V150"/><circle cx="770" cy="84" r="4.5" fill="#cf222e"/><path class="cap" d="M596 130h28M596 140h28"/><text x="588" y="134" class="" text-anchor="end">470 µF</text><text x="632" y="128" class="" text-anchor="start">+</text><path class="gnd" d="M610 140V156"/><path class="gnd" d="M599 156h22M603 161h14M607 166h6"/><path class="dat" d="M530 180H560M610 180H690"/><rect x="560" y="170" width="50" height="20" rx="8" class="res"/><text x="585" y="208" class="" text-anchor="middle">330 Ω</text><rect x="690" y="150" width="120" height="140" rx="8" class="box"/><text x="750" y="222" class="t" text-anchor="middle">Olho esquerdo</text><text x="750" y="240" class="s" text-anchor="middle">2 × WS2812B</text><text x="698" y="185" class="pin" text-anchor="start">DIN</text><text x="778" y="142" class="s" text-anchor="start">5V</text><text x="750" y="278" class="s" text-anchor="middle">GND</text><path class="gnd" d="M750 290V306"/><path class="gnd" d="M739 306h22M743 311h14M747 316h6"/><rect x="860" y="150" width="120" height="140" rx="8" class="box"/><text x="920" y="222" class="t" text-anchor="middle">Olho direito</text><text x="920" y="240" class="s" text-anchor="middle">2 × WS2812B</text><text x="868" y="185" class="pin" text-anchor="start">DIN</text><text x="948" y="142" class="s" text-anchor="start">5V</text><text x="920" y="278" class="s" text-anchor="middle">GND</text><path class="gnd" d="M920 290V306"/><path class="gnd" d="M909 306h22M913 311h14M917 316h6"/><path class="dat" d="M690 180H690"/><path class="dat" d="M530 330H600M650 330H835V180H860"/><text x="802" y="266" class="pin" text-anchor="end"></text><text x="835" y="380" class="s" text-anchor="middle">O olho esquerdo é o de quem olha de frente.</text><text x="835" y="397" class="s" text-anchor="middle">Dentro de cada olho: ligacao-dos-olhos.svg.</text><path class="v33" d="M330 260H240V330H330"/><path class="v33" d="M240 260H150V300"/><circle cx="240" cy="260" r="4.5" fill="#8250df"/><rect x="141" y="300" width="18" height="50" rx="8" class="res"/><text x="133" y="330" class="" text-anchor="end">10 kΩ</text><path class="sig" d="M150 350V400"/><path class="sig" d="M330 400H150V430"/><circle cx="150" cy="400" r="4.5" fill="#0969da"/><rect x="128" y="430" width="44" height="44" rx="8" class="box"/><circle cx="150" cy="452" r="11" fill="#cf222e"/><path class="gnd" d="M150 474V496"/><path class="gnd" d="M139 496h22M143 501h14M147 506h6"/><text x="118" y="450" class="" text-anchor="end">botão</text><text x="118" y="467" class="s" text-anchor="end">liga/desliga</text><text x="265" y="322" class="s" text-anchor="middle">direto</text><path class="sig" d="M330 480H270V545"/><circle cx="270" cy="575" r="30" class="box"/><text x="270" y="580" class="h" text-anchor="middle">♪</text><path class="gnd" d="M270 605V622"/><path class="gnd" d="M259 622h22M263 627h14M267 632h6"/><text x="228" y="580" class="" text-anchor="end">buzzer passivo</text><path class="gnd" d="M530 500H575V525"/><path class="gnd" d="M564 525h22M568 530h14M572 535h6"/><rect x="640" y="420" width="345" height="200" rx="8" class="note"/><text x="658" y="448" class="t" text-anchor="start">Atenção</text><text x="658" y="474" class="" text-anchor="start">O pino 2 vai no 3V3, nunca no GND:</text><text x="658" y="493" class="" text-anchor="start">no GND a placa pode não iniciar.</text><text x="658" y="512" class="" text-anchor="start"></text><text x="658" y="531" class="" text-anchor="start">Todos os símbolos de terra são o mesmo</text><text x="658" y="550" class="" text-anchor="start">GND da placa.</text><text x="658" y="569" class="" text-anchor="start"></text><text x="658" y="588" class="" text-anchor="start">Capacitor eletrolítico: a faixa é o negativo.</text><text x="658" y="607" class="" text-anchor="start">Pino 10 (D10) fica solto nesta versão.</text><rect x="600" y="320" width="50" height="20" rx="8" class="res"/><text x="625" y="358" text-anchor="middle">330 Ω</text><text x="518" y="335" class="pin" text-anchor="end">6 (D4)</text></svg>