<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="1240" height="720"><style>text{font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1f2328}.h{font-size:21px;font-weight:700}
.t{font-size:16px;font-weight:600}.s{font-size:13px;fill:#57606a}.pin{font-weight:700}.silk{font-size:11px;font-weight:700}
.w{fill:none;stroke-width:3;stroke-linecap:round}.res{fill:#fff;stroke:#1f2328;stroke-width:1.5}
.win{fill:none;stroke:#0969da;stroke-width:2;stroke-dasharray:7 5}</style><rect width="1240" height="720" fill="#fff"/><text x="40" y="48" class="h" text-anchor="start">Companion: ligação dos olhos</text><text x="40" y="76" class="s" text-anchor="start">As tampinhas dos dois olhos vistas de frente, como se o rosto fosse transparente: é o lado dos LEDs e dos pads, onde se solda.</text><text x="40" y="96" class="s" text-anchor="start">Cada plaquinha tem 33 × 10 mm, com um LED no meio. Ponha as duas deitadas, uma encostada na outra.</text><rect x="190" y="176" width="330" height="100" rx="4" fill="#161616"/><rect x="194" y="191" width="34" height="14" rx="7" fill="#e8a33d"/><text x="236" y="202" class="silk" text-anchor="start" style="fill:#fff">+5V</text><rect x="194" y="219" width="34" height="14" rx="7" fill="#e8a33d"/><text x="236" y="230" class="silk" text-anchor="start" style="fill:#fff">DO</text><rect x="194" y="247" width="34" height="14" rx="7" fill="#e8a33d"/><text x="236" y="258" class="silk" text-anchor="start" style="fill:#fff">GND</text><rect x="482" y="191" width="34" height="14" rx="7" fill="#e8a33d"/><text x="474" y="202" class="silk" text-anchor="end" style="fill:#fff">+5V</text><rect x="482" y="219" width="34" height="14" rx="7" fill="#e8a33d"/><text x="474" y="230" class="silk" text-anchor="end" style="fill:#fff">DIN</text><rect x="482" y="247" width="34" height="14" rx="7" fill="#e8a33d"/><text x="474" y="258" class="silk" text-anchor="end" style="fill:#fff">GND</text><rect x="330.0" y="201.0" width="50" height="50" rx="4" fill="#f4f4f4" stroke="#bbb"/><circle cx="355.0" cy="226.0" r="15" fill="#fbe3d9"/><circle cx="355.0" cy="226.0" r="2.5" fill="#999"/><text x="355.0" y="268" class="silk" text-anchor="middle" style="fill:#9aa0a6">◀ dado ◀</text><rect x="190" y="280" width="330" height="100" rx="4" fill="#161616"/><rect x="194" y="295" width="34" height="14" rx="7" fill="#e8a33d"/><text x="236" y="306" class="silk" text-anchor="start" style="fill:#fff">GND</text><rect x="194" y="323" width="34" height="14" rx="7" fill="#e8a33d"/><text x="236" y="334" class="silk" text-anchor="start" style="fill:#fff">DIN</text><rect x="194" y="351" width="34" height="14" rx="7" fill="#e8a33d"/><text x="236" y="362" class="silk" text-anchor="start" style="fill:#fff">+5V</text><rect x="482" y="295" width="34" height="14" rx="7" fill="#e8a33d"/><text x="474" y="306" class="silk" text-anchor="end" style="fill:#fff">GND</text><rect x="482" y="323" width="34" height="14" rx="7" fill="#e8a33d"/><text x="474" y="334" class="silk" text-anchor="end" style="fill:#fff">DO</text><rect x="482" y="351" width="34" height="14" rx="7" fill="#e8a33d"/><text x="474" y="362" class="silk" text-anchor="end" style="fill:#fff">+5V</text><rect x="330.0" y="305.0" width="50" height="50" rx="4" fill="#f4f4f4" stroke="#bbb"/><circle cx="355.0" cy="330.0" r="15" fill="#fbe3d9"/><circle cx="355.0" cy="330.0" r="2.5" fill="#999"/><text x="355.0" y="372" class="silk" text-anchor="middle" style="fill:#9aa0a6">▶ dado ▶</text><text x="355.0" y="132" class="t" text-anchor="middle">Olho esquerdo · pino 5</text><text x="355.0" y="166" class="s" text-anchor="middle">plaquinha de cima · LED 0</text><text x="355.0" y="402" class="s" text-anchor="middle">plaquinha de baixo, girada 180° · LED 1</text><rect x="315.0" y="198.0" width="80" height="160" class="win"/><path d="M211,254 C171.0,254 171.0,302 211,302" class="w" stroke="#57606a"/><circle cx="211" cy="254" r="4.5" fill="#57606a"/><circle cx="211" cy="302" r="4.5" fill="#57606a"/><path d="M211,226 C149.66666666666666,226 149.66666666666666,330 211,330" class="w" stroke="#d97757"/><circle cx="211" cy="226" r="4.5" fill="#d97757"/><circle cx="211" cy="330" r="4.5" fill="#d97757"/><path d="M211,198 C128.33333333333331,198 128.33333333333331,358 211,358" class="w" stroke="#cf222e"/><circle cx="211" cy="198" r="4.5" fill="#cf222e"/><circle cx="211" cy="358" r="4.5" fill="#cf222e"/><path d="M499,198 H556 V490 H170" class="w" stroke="#cf222e"/><circle cx="499" cy="198" r="4.5" fill="#cf222e"/><text x="158" y="495" class="pin" text-anchor="end">5V da SuperMini</text><path d="M499,226 H546 V460 H170" class="w" stroke="#d97757"/><circle cx="499" cy="226" r="4.5" fill="#d97757"/><text x="158" y="465" class="pin" text-anchor="end">pino 5 da SuperMini</text><rect x="336.0" y="452" width="44" height="16" rx="8" class="res"/><text x="358.0" y="446" class="s" text-anchor="middle">330 Ω</text><path d="M499,254 H536 V430 H170" class="w" stroke="#57606a"/><circle cx="499" cy="254" r="4.5" fill="#57606a"/><text x="158" y="435" class="pin" text-anchor="end">GND da SuperMini</text><rect x="720" y="176" width="330" height="100" rx="4" fill="#161616"/><rect x="724" y="191" width="34" height="14" rx="7" fill="#e8a33d"/><text x="766" y="202" class="silk" text-anchor="start" style="fill:#fff">GND</text><rect x="724" y="219" width="34" height="14" rx="7" fill="#e8a33d"/><text x="766" y="230" class="silk" text-anchor="start" style="fill:#fff">DIN</text><rect x="724" y="247" width="34" height="14" rx="7" fill="#e8a33d"/><text x="766" y="258" class="silk" text-anchor="start" style="fill:#fff">+5V</text><rect x="1012" y="191" width="34" height="14" rx="7" fill="#e8a33d"/><text x="1004" y="202" class="silk" text-anchor="end" style="fill:#fff">GND</text><rect x="1012" y="219" width="34" height="14" rx="7" fill="#e8a33d"/><text x="1004" y="230" class="silk" text-anchor="end" style="fill:#fff">DO</text><rect x="1012" y="247" width="34" height="14" rx="7" fill="#e8a33d"/><text x="1004" y="258" class="silk" text-anchor="end" style="fill:#fff">+5V</text><rect x="860.0" y="201.0" width="50" height="50" rx="4" fill="#f4f4f4" stroke="#bbb"/><circle cx="885.0" cy="226.0" r="15" fill="#fbe3d9"/><circle cx="885.0" cy="226.0" r="2.5" fill="#999"/><text x="885.0" y="268" class="silk" text-anchor="middle" style="fill:#9aa0a6">▶ dado ▶</text><rect x="720" y="280" width="330" height="100" rx="4" fill="#161616"/><rect x="724" y="295" width="34" height="14" rx="7" fill="#e8a33d"/><text x="766" y="306" class="silk" text-anchor="start" style="fill:#fff">+5V</text><rect x="724" y="323" width="34" height="14" rx="7" fill="#e8a33d"/><text x="766" y="334" class="silk" text-anchor="start" style="fill:#fff">DO</text><rect x="724" y="351" width="34" height="14" rx="7" fill="#e8a33d"/><text x="766" y="362" class="silk" text-anchor="start" style="fill:#fff">GND</text><rect x="1012" y="295" width="34" height="14" rx="7" fill="#e8a33d"/><text x="1004" y="306" class="silk" text-anchor="end" style="fill:#fff">+5V</text><rect x="1012" y="323" width="34" height="14" rx="7" fill="#e8a33d"/><text x="1004" y="334" class="silk" text-anchor="end" style="fill:#fff">DIN</text><rect x="1012" y="351" width="34" height="14" rx="7" fill="#e8a33d"/><text x="1004" y="362" class="silk" text-anchor="end" style="fill:#fff">GND</text><rect x="860.0" y="305.0" width="50" height="50" rx="4" fill="#f4f4f4" stroke="#bbb"/><circle cx="885.0" cy="330.0" r="15" fill="#fbe3d9"/><circle cx="885.0" cy="330.0" r="2.5" fill="#999"/><text x="885.0" y="372" class="silk" text-anchor="middle" style="fill:#9aa0a6">◀ dado ◀</text><text x="885.0" y="132" class="t" text-anchor="middle">Olho direito · pino 6</text><text x="885.0" y="166" class="s" text-anchor="middle">plaquinha de cima · LED 0</text><text x="885.0" y="402" class="s" text-anchor="middle">plaquinha de baixo, girada 180° · LED 1</text><rect x="845.0" y="198.0" width="80" height="160" class="win"/><path d="M1029,254 C1069.0,254 1069.0,302 1029,302" class="w" stroke="#cf222e"/><circle cx="1029" cy="254" r="4.5" fill="#cf222e"/><circle cx="1029" cy="302" r="4.5" fill="#cf222e"/><path d="M1029,226 C1090.3333333333333,226 1090.3333333333333,330 1029,330" class="w" stroke="#d97757"/><circle cx="1029" cy="226" r="4.5" fill="#d97757"/><circle cx="1029" cy="330" r="4.5" fill="#d97757"/><path d="M1029,198 C1111.6666666666667,198 1111.6666666666667,358 1029,358" class="w" stroke="#57606a"/><circle cx="1029" cy="198" r="4.5" fill="#57606a"/><circle cx="1029" cy="358" r="4.5" fill="#57606a"/><path d="M741,198 H684 V490 H1070" class="w" stroke="#57606a"/><circle cx="741" cy="198" r="4.5" fill="#57606a"/><text x="1082" y="495" class="pin" text-anchor="start">GND da SuperMini</text><path d="M741,226 H694 V460 H1070" class="w" stroke="#d97757"/><circle cx="741" cy="226" r="4.5" fill="#d97757"/><text x="1082" y="465" class="pin" text-anchor="start">pino 6 da SuperMini</text><rect x="860.0" y="452" width="44" height="16" rx="8" class="res"/><text x="882.0" y="446" class="s" text-anchor="middle">330 Ω</text><path d="M741,254 H704 V430 H1070" class="w" stroke="#cf222e"/><circle cx="741" cy="254" r="4.5" fill="#cf222e"/><text x="1082" y="435" class="pin" text-anchor="start">5V da SuperMini</text><text x="620.0" y="270" class="t" text-anchor="middle">meio do corpo</text><text x="620.0" y="290" class="s" text-anchor="middle">(canal dos fios)</text><text x="40" y="556" class="" text-anchor="start">1. Os três fios de cada olho chegam pela ponta do canal, na plaquinha de cima (LED 0). O dado sai pela outra</text><text x="62" y="580" class="" text-anchor="start">ponta e passa para a de baixo (LED 1).</text><text x="40" y="604" class="" text-anchor="start">2. A de baixo vai girada 180°: a entrada (DIN) dela fica na ponta de fora, junto da saída (DO) da de cima.</text><text x="62" y="628" class="" text-anchor="start">Três fiozinhos ligam as duas: +5V com +5V, DO com DIN e GND com GND. O DO da de baixo fica sem nada.</text><text x="40" y="652" class="" text-anchor="start">3. Tracejado: a janela do olho (8 × 16 mm). Cada LED fica atrás de uma metade dela.</text><text x="40" y="676" class="" text-anchor="start">4. Confira a ordem dos pads na sua plaquinha: nesta, +5V, DIN e GND. Se a sua for outra, siga o que está escrito nela.</text><text x="40" y="700" class="" text-anchor="start">5. O capacitor de 470 µF, o botão e o buzzer estão em esquema-usb.svg.</text><path d="M1010,580 H1050" class="w" stroke="#cf222e"/><text x="1062" y="585" class="" text-anchor="start">+5V</text><path d="M1010,606 H1050" class="w" stroke="#d97757"/><text x="1062" y="611" class="" text-anchor="start">dado</text><path d="M1010,632 H1050" class="w" stroke="#57606a"/><text x="1062" y="637" class="" text-anchor="start">GND</text><rect x="1010" y="649" width="40" height="18" class="win"/><text x="1062" y="663" class="" text-anchor="start">janela do olho</text></svg>
